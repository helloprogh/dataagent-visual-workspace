name: Refactor Frontend Check

on:
  push:
    branches:
      - refactor/element-plus-x-agui-vite8
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/element-plus-x-agui-vite8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Adapter tests
        run: npm test -w adapter

      - name: Offline project checks
        run: npm run check:offline -w frontend

      - name: Typecheck frontend
        run: npm run typecheck -w frontend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
